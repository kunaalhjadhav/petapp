name: mobile release

# Builds a store release of one Flutter app: a signed Android App Bundle (uploaded to Play's internal track when the
# Play key is set) and an iOS archive (uploaded to TestFlight when the App Store Connect key is set).
#
# Secrets (repository or "mobile-release" environment):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD   upload key
#   PLAY_SERVICE_ACCOUNT_JSON                                  optional: upload to Play (internal testing)
#   IOS_DIST_CERT_P12_BASE64, IOS_DIST_CERT_PASSWORD, IOS_PROVISIONING_PROFILE_BASE64, IOS_TEAM_ID
#   APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_P8   optional: upload to TestFlight
#   SENTRY_DSN_MOBILE, FIREBASE_API_KEY, FIREBASE_APP_ID, FIREBASE_SENDER_ID, FIREBASE_PROJECT_ID   optional
# Variables: API_BASE_URL (production API), SHARE_DOMAIN (e.g. petapp.in).
on:
  workflow_dispatch:
    inputs:
      app:
        description: Which app
        type: choice
        options: [customer-mobile, service-partner-mobile, product-partner-mobile]
      build_number:
        description: 'Build number (must go up with every upload; e.g. the run number)'
        required: true
      platforms:
        description: Platforms to build
        type: choice
        default: both
        options: [both, android, ios]

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.27.4'

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: 'apps/${{ inputs.app }}' } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', cache: true }
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  android:
    needs: checks
    if: inputs.platforms != 'ios'
    runs-on: ubuntu-latest
    environment: mobile-release
    env:
      HAS_PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    defaults: { run: { working-directory: 'apps/${{ inputs.app }}' } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', cache: true }
      - name: Generate and configure the Android project
        run: |
          case "${{ inputs.app }}" in
            customer-mobile) ORG=com.petapp; NAME=petapp ;;
            service-partner-mobile) ORG=com.petapp.partner; NAME=petapp_partner ;;
            product-partner-mobile) ORG=com.petapp.seller; NAME=petapp_seller ;;
          esac
          flutter create . --org "$ORG" --project-name "$NAME" --platforms android
          python3 ../../scripts/mobile/configure_platforms.py . --domain "${{ vars.SHARE_DOMAIN }}" --release
      - name: Upload key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > android/app/upload.jks
          printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            '${{ secrets.ANDROID_KEYSTORE_PASSWORD }}' '${{ secrets.ANDROID_KEY_ALIAS }}' '${{ secrets.ANDROID_KEY_PASSWORD }}' > android/key.properties
      - name: Build the app bundle
        run: |
          flutter build appbundle --release --build-number "${{ inputs.build_number }}" \
            --dart-define=API_BASE_URL="${{ vars.API_BASE_URL }}" \
            --dart-define=SHARE_BASE_URL="https://${{ vars.SHARE_DOMAIN }}" \
            --dart-define=APP_ENV=production \
            --dart-define=SENTRY_DSN="${{ secrets.SENTRY_DSN_MOBILE }}" \
            --dart-define=FIREBASE_API_KEY="${{ secrets.FIREBASE_API_KEY }}" \
            --dart-define=FIREBASE_APP_ID="${{ secrets.FIREBASE_APP_ID }}" \
            --dart-define=FIREBASE_SENDER_ID="${{ secrets.FIREBASE_SENDER_ID }}" \
            --dart-define=FIREBASE_PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}" \
            --obfuscate --split-debug-info=build/symbols
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-android-${{ inputs.build_number }}
          path: |
            apps/${{ inputs.app }}/build/app/outputs/bundle/release/*.aab
            apps/${{ inputs.app }}/build/symbols
      - name: Upload to Play (internal testing)
        if: env.HAS_PLAY_KEY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ inputs.app == 'customer-mobile' && 'com.petapp.petapp' || inputs.app == 'service-partner-mobile' && 'com.petapp.partner.petapp_partner' || 'com.petapp.seller.petapp_seller' }}
          releaseFiles: apps/${{ inputs.app }}/build/app/outputs/bundle/release/*.aab
          track: internal
          status: completed

  ios:
    needs: checks
    if: inputs.platforms != 'android'
    runs-on: macos-14
    environment: mobile-release
    env:
      HAS_ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_P8 != '' }}
    defaults: { run: { working-directory: 'apps/${{ inputs.app }}' } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', cache: true }
      - name: Generate and configure the iOS project
        run: |
          case "${{ inputs.app }}" in
            customer-mobile) ORG=com.petapp; NAME=petapp ;;
            service-partner-mobile) ORG=com.petapp.partner; NAME=petapp_partner ;;
            product-partner-mobile) ORG=com.petapp.seller; NAME=petapp_seller ;;
          esac
          flutter create . --org "$ORG" --project-name "$NAME" --platforms ios
          python3 ../../scripts/mobile/configure_platforms.py . --domain "${{ vars.SHARE_DOMAIN }}" --release
      - name: Signing certificate and profile
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KC=$RUNNER_TEMP/build.keychain-db; KP=$(openssl rand -hex 16)
          security create-keychain -p "$KP" "$KC" && security set-keychain-settings -lut 21600 "$KC" && security unlock-keychain -p "$KP" "$KC"
          echo "$P12" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security list-keychain -d user -s "$KC"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 -d > "$RUNNER_TEMP/app.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/app.mobileprovision" | plutil -extract UUID raw -)
          cp "$RUNNER_TEMP/app.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          NAME=$(security cms -D -i "$RUNNER_TEMP/app.mobileprovision" | plutil -extract Name raw -)
          BUNDLE=$(security cms -D -i "$RUNNER_TEMP/app.mobileprovision" | plutil -extract Entitlements.application-identifier raw - | cut -d. -f2-)
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.IOS_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE</key><string>$NAME</string></dict>
          </dict></plist>
          PLIST
      - name: Build the archive
        run: |
          flutter build ipa --release --build-number "${{ inputs.build_number }}" \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist" \
            --dart-define=API_BASE_URL="${{ vars.API_BASE_URL }}" \
            --dart-define=SHARE_BASE_URL="https://${{ vars.SHARE_DOMAIN }}" \
            --dart-define=APP_ENV=production \
            --dart-define=SENTRY_DSN="${{ secrets.SENTRY_DSN_MOBILE }}" \
            --dart-define=FIREBASE_API_KEY="${{ secrets.FIREBASE_API_KEY }}" \
            --dart-define=FIREBASE_APP_ID="${{ secrets.FIREBASE_APP_ID }}" \
            --dart-define=FIREBASE_SENDER_ID="${{ secrets.FIREBASE_SENDER_ID }}" \
            --dart-define=FIREBASE_PROJECT_ID="${{ secrets.FIREBASE_PROJECT_ID }}" \
            --obfuscate --split-debug-info=build/symbols
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-ios-${{ inputs.build_number }}
          path: |
            apps/${{ inputs.app }}/build/ios/ipa/*.ipa
            apps/${{ inputs.app }}/build/symbols
      - name: Upload to TestFlight
        if: env.HAS_ASC_KEY == 'true'
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          xcrun altool --upload-app --type ios -f build/ios/ipa/*.ipa \
            --apiKey "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"
