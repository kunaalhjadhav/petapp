name: security

# Dependency vulnerabilities, leaked secrets and code scanning. Runs on every push and pull request, and weekly so new
# advisories against unchanged code are caught too. Container images are scanned in ci.yml (Trivy).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 2 * * 1' # Mondays 08:00 India time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    name: npm audit (high in shipped code, or critical anywhere, fails the build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Shipped dependencies (high or critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Development tooling too (critical)
        run: npm audit --audit-level=critical

  secrets:
    name: secret scan (gitleaks, whole history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - run: gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 .

  codeql:
    name: code scanning (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
