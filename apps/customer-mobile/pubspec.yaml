name: petapp
description: PetApp customer app — pets, reels, community.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  sentry_flutter: ^8.14.0
  go_router: ^14.6.0
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  video_player: ^2.9.2
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  app_links: ^6.3.2
  shared_preferences: ^2.3.3
  # Live chat (Phase 9a): a plain WebSocket to the API.
  web_socket_channel: ^3.0.1
  # Razorpay checkout for contest entry fees (Android/iOS). Unused when the API runs the development fake.
  razorpay_flutter: ^1.3.7
  # "Services near me". The app falls back to choosing a city if location is refused.
  geolocator: ^13.0.2
  # Push is optional: it activates only when Firebase options are passed with --dart-define.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  # Sign-in: Google on Android, Apple on iPhone (both verified by the API: /auth/google, /auth/apple).
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.6

  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
